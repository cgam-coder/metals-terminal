name: 'Verificar índices y Bitcoin SVG nativos'
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Publicar Metals Terminal']
    types: [completed]
permissions:
  contents: read
jobs:
  inspect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with: {ref: main}
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Comprobar sintaxis del controlador
        run: node --check indices.js
      - name: Preparar navegador
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Verificar SVG, cinco índices más BTC, temporalidad y responsive
        run: |
          mkdir -p evidence-indices-native
          python3 -m http.server 8753 --bind 127.0.0.1 >/tmp/metals-local.log 2>&1 &
          cat > check-indices.mjs <<'EOF'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const output={at:new Date().toISOString(),tests:[],errors:[]};
          const assert=(ok,msg)=>{if(!ok)throw Error(msg)};
          const timestamps=[],bitcoinTimestamps=[];
          for(let t=Date.UTC(2022,0,3);t<=Date.UTC(2026,10,20);t+=86400000){
           const day=new Date(t).getUTCDay();
           bitcoinTimestamps.push(Math.floor(t/1000));
           if(day>0&&day<6)timestamps.push(Math.floor((t+18*3600000)/1000));
          }
          try{
           for(const width of [1600,1024,390]){
            const ctx=await browser.newContext({viewport:{width,height:850}});
            const page=await ctx.newPage();
            page.on('pageerror',e=>output.errors.push({width,type:'runtime',error:String(e)}));
            // CI-ONLY synthetic fixture. Intercepted in an isolated browser, never published.
            const fixture=(route,blockBitcoin=false)=>{
             const url=route.request().url(),match=url.match(/\/chart\/([^?]+)/);
             if(!match)return route.abort();
             const symbol=decodeURIComponent(match[1]);
             const codes=['^GSPC','^IXIC','^DJI','^RUT','^STOXX50E','BTC-USD'];
             const index=codes.indexOf(symbol),btc=symbol==='BTC-USD';
             if(index<0||(btc&&blockBitcoin))return route.abort();
             const stamps=btc?bitcoinTimestamps:timestamps;
             const closes=stamps.map((t,i)=>Number((600+index*170+i*(0.33+index/18)+12*Math.sin(i/15+index)).toFixed(3)));
             return route.fulfill({status:200,contentType:'application/json',
              headers:{'access-control-allow-origin':'*'},
              body:JSON.stringify({chart:{error:null,result:[{
               meta:{symbol},timestamp:stamps,indicators:{quote:[{close:closes}]}
              }]}})});
            };
            await page.route('https://proxy.cors.dev/**',route=>fixture(route));
            try{
             await page.goto('http://127.0.0.1:8753/?period=1mo',{waitUntil:'domcontentloaded',timeout:40000});
             await page.waitForSelector('#indices-comparison svg[data-market-svg="1"]',{timeout:15000});
             const state=await page.evaluate(()=>{
              const panel=document.querySelector('.indices-panel'),rect=panel.getBoundingClientRect();
              return {version:document.getElementById('version').textContent,
               symbols:window.METALS_INDICES_SYMBOLS,
               count:document.querySelector('#indices-comparison').dataset.indicesCount,
               btc:document.querySelector('#indices-comparison').dataset.bitcoinState,
               series:document.querySelector('#indices-comparison').dataset.comparisonSeriesCount,
               lines:document.querySelectorAll('#indices-comparison svg path').length,
               frames:document.querySelectorAll('#indices-comparison iframe').length,
               source:[...panel.querySelectorAll('a')].map(a=>a.href),
               label:document.getElementById('indices-window').textContent,
               panel:{width:rect.width,height:rect.height},
               pageWidth:document.documentElement.scrollWidth};
             });
             assert(state.version.includes('V5.1'),'wrong version');
             assert(JSON.stringify(state.symbols)===JSON.stringify(['^GSPC','^IXIC','^DJI','^RUT','^STOXX50E','BTC-USD']),'symbols');
             assert(state.lines===6&&state.count==='5'&&state.btc==='available'&&state.series==='6',
              'five indices plus Bitcoin six SVG lines absent');
             assert(!state.frames,'third-party iframe present');
             assert(state.source.some(x=>x.includes('yahoo.com')),'missing attribution');
             assert(state.label.includes('5/5')&&state.label.includes('BTC incluido'),'coverage label incorrect');
             assert(state.pageWidth<=width+2,'horizontal overflow');
             await page.locator('[data-inspect="indices"]').click();
             assert(await page.locator('#detail-chart svg path').count()===6,'expanded BTC+indices chart not native');
             await page.locator('#detail-close').click();
             await page.locator('[data-global-period="10y"]').click();
             await page.waitForFunction(()=>document.getElementById('indices-window')?.textContent.includes('10A'),null,{timeout:10000});
             await page.locator('#theme-toggle').click();
             assert(await page.evaluate(()=>document.documentElement.dataset.theme)==='day','day theme');
             await page.locator('[data-global-period="1d"]').click();
             await page.waitForFunction(()=>document.getElementById('indices-comparison')?.textContent.includes('intradía'),null,{timeout:10000});
             assert(await page.locator('#indices-comparison svg').count()===0,'fabricated intraday');
             // With the crypto provider blocked, the five equity curves must survive.
             if(width===1600){
              const noBtc=await ctx.newPage();
              await noBtc.route('https://proxy.cors.dev/**',route=>fixture(route,true));
              try{
               await noBtc.goto('http://127.0.0.1:8753/?period=1mo',{waitUntil:'domcontentloaded',timeout:40000});
               await noBtc.waitForFunction(()=>document.getElementById('indices-comparison')?.dataset.indicesCount==='5',null,{timeout:15000});
               await noBtc.waitForFunction(()=>document.getElementById('indices-comparison')?.dataset.bitcoinState==='unavailable',null,{timeout:15000});
               const fallback=await noBtc.evaluate(()=>({
                paths:document.querySelectorAll('#indices-comparison svg path').length,
                note:document.getElementById('indices-window')?.textContent,
                state:document.getElementById('indices-comparison')?.dataset.indicesState
               }));
               assert(fallback.paths===5&&fallback.note.includes('BTC no disponible')&&fallback.state==='partial',
                'failed BTC must retain five real-stock series');
               output.fallback=fallback;
              }finally{await noBtc.close();}
             }
             await page.screenshot({path:'evidence-indices-native/'+width+'.png'});
             output.tests.push({width,passed:true,state});
            }catch(e){output.errors.push({width,type:'assertion',error:String(e)})}
            await ctx.close();
           }
          }finally{
           await browser.close();
           fs.writeFileSync('evidence-indices-native/result.json',JSON.stringify(output,null,2));
           console.log('INDEX_NATIVE_EVIDENCE '+JSON.stringify(output));
           if(output.errors.length)process.exitCode=1;
          }
          EOF
          node check-indices.mjs
      - name: Consultar 5 índices y BTC reales sin fixture (diagnóstico)
        continue-on-error: true
        if: always()
        run: |
          node --input-type=module - <<'EOF'
          const codes=['^GSPC','^IXIC','^DJI','^RUT','^STOXX50E','BTC-USD'];
          const result=await Promise.all(codes.map(async symbol=>{
           const url='https://proxy.cors.dev/https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(symbol)+'?range=1mo&interval=1d';
           try{
            const response=await fetch(url,{signal:AbortSignal.timeout(26000)});
            if(!response.ok)return {symbol,available:false,http:response.status};
            const raw=await response.json(),o=raw.chart?.result?.[0];
            return {symbol,available:o?.meta?.symbol===symbol&&Array.isArray(o.timestamp)&&o.timestamp.length>1,
             observations:o?.timestamp?.length||0};
           }catch(e){return {symbol,available:false,error:String(e)}}
          }));
          console.log('REAL_SOURCE_DIAGNOSTIC '+JSON.stringify(result));
          if(result.some(x=>!x.available))process.exitCode=1;
          EOF
      - name: Probar curva real de cinco índices y BTC publicado
        run: |
          node --input-type=module - <<'EOF'
          import {chromium} from 'playwright';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          let pass=false,last='';
          try{
           for(let n=1;n<=2&&!pass;n++){
            const page=await browser.newPage({viewport:{width:1450,height:850}});
            try{
             await page.goto('https://cgam-coder.github.io/metals-terminal/?period=1mo&realindex=v48-btc',{waitUntil:'domcontentloaded',timeout:42000});
             await page.waitForFunction(()=>{
              const host=document.getElementById('indices-comparison');
              return host?.dataset.indicesCount==='5'&&host?.dataset.bitcoinState==='available'&&
               host?.dataset.comparisonSeriesCount==='6'&&host.querySelectorAll('svg path').length===6;
             },null,{timeout:35000});
             const result=await page.evaluate(()=>({
              version:document.getElementById('version')?.textContent,
              count:document.getElementById('indices-comparison')?.dataset.indicesCount,
              bitcoin:document.getElementById('indices-comparison')?.dataset.bitcoinState,
              six:document.getElementById('indices-comparison')?.dataset.comparisonSeriesCount,
              until:document.getElementById('indices-comparison')?.dataset.indicesLast,
              dates:document.getElementById('indices-window')?.textContent,
              paths:document.querySelectorAll('#indices-comparison svg path').length
             }));
             console.log('REAL_BROWSER_INDICES '+JSON.stringify(result));
             if(result.count==='5'&&result.bitcoin==='available'&&result.paths===6){pass=true;break;}
            }catch(e){last=String(e);console.warn('Real browser attempt '+n+': '+last)}
            finally{await page.close();}
           }
          }finally{await browser.close();}
          if(!pass)throw Error('La curva real de cinco índices y BTC no cargó en el navegador: '+last);
          EOF
      - name: Conservar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: equity-indices-plus-bitcoin-native
          path: evidence-indices-native/
          retention-days: 7
