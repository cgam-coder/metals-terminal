name: Verificar tema diurno/nocturno
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/verify-theme.yml', 'index.html', 'theme.css']
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Playwright Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Comprobar tema y persistencia en produccion
        run: |
          mkdir -p evidence-theme
          cat > verify-theme.mjs <<'EOF'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const result={screens:{},errors:[],createdAt:new Date().toISOString()};
          const base='https://cgam-coder.github.io/metals-terminal/?period=1mo&themeTest=20261119';
          const check=(condition,message)=>{if(!condition)throw Error(message)};
          const colors=async page=>page.evaluate(()=>{
            const bg=sel=>getComputedStyle(document.querySelector(sel)).backgroundColor;
            const fg=sel=>getComputedStyle(document.querySelector(sel)).color;
            const css=document.querySelector('link[href^="./theme.css"]');
            const axis=document.querySelector('#curve-graph .axis-text');
            const line=document.querySelector('#curve-graph path[stroke="#f4ba3c"]');
            return {
              theme:document.documentElement.dataset.theme||'night',
              button:document.querySelector('#theme-toggle')?.innerText,
              pressed:document.querySelector('#theme-toggle')?.getAttribute('aria-pressed'),
              bodyBg:bg('body'),panelBg:bg('.panel'),cardBg:bg('.ticker-card'),
              heading:fg('.panel-title'),styleSheet:!!css,
              axColor:axis?getComputedStyle(axis).fill:null,
              goldLine:line?getComputedStyle(line).stroke:null,
              width:document.documentElement.scrollWidth,viewport:innerWidth,
              chartCount:document.querySelectorAll('svg[data-market-svg],svg[data-macro-svg],svg[data-market-tile-svg]').length,
              period:document.querySelector('#global-timeframes .active')?.textContent,
              v4Cards:document.querySelectorAll('.v4-card').length,
              url:location.href
            };
          });
          const headerLayout=async page=>page.evaluate(()=>{
            const rect=selector=>{const el=document.querySelector(selector);if(!el)return null;const b=el.getBoundingClientRect();return {x:b.x,y:b.y,width:b.width,height:b.height,right:b.right,bottom:b.bottom}};
            return {
              header:rect('.header'),brand:rect('.brand'),title:rect('.brand-title'),
              stamp:rect('#stamp'),theme:rect('#theme-toggle'),
              timeframes:rect('#global-timeframes'),actions:rect('.header-secondary-actions'),
              sources:rect('#method-button'),refresh:rect('#refresh'),picker:rect('#header-period-picker'),
              subtitle:document.querySelector('.header .subtitle')?.textContent?.trim(),
              brandText:document.querySelector('.brand-title')?.textContent?.replace(/\\s+/g,' ').trim(),
              sourceParent:document.querySelector('#method-button')?.parentElement?.className,
              titleColors:[getComputedStyle(document.querySelector('.brand-title span')).color,getComputedStyle(document.querySelector('.brand-title em')).color],
              marketStatusRemoved:!document.querySelector('.header')?.textContent?.includes('Mercado · datos bajo demanda'),
              viewport:innerWidth,scrollWidth:document.documentElement.scrollWidth
            };
          });
          try {
            for(const [name,width,height] of [['desktop',1440,900],['mobile',390,844],['small',360,780]]){
              const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
              const page=await context.newPage();
              page.on('pageerror',err=>result.errors.push({name,type:'pageerror',message:err.stack||err.message}));
              try{
                await page.goto(base,{waitUntil:'domcontentloaded',timeout:45000});
                await page.waitForSelector('#theme-toggle',{timeout:10000});
                check(await page.locator('link[href^="./theme.css"]').count()===1,'stylesheet link missing');
                const cssResponse=await page.request.get('https://cgam-coder.github.io/metals-terminal/theme.css');
                check(cssResponse.ok(),'day stylesheet not published '+cssResponse.status());
                const first=await colors(page);
                check(first.theme==='night'&&first.button.includes('Noche'),'night must be default');
                check(first.v4Cards===4,'V4 cards missing');
                const header=await headerLayout(page);
                result.screens[name]={header};
                check(header.subtitle==='Oro · Plata · Cobre','obsolete subtitle '+header.subtitle);
                check(header.brandText==='METALS TERMINAL','brand text mismatch '+header.brandText);
                check(header.titleColors[0]!==header.titleColors[1],'brand lost two-color identity');
                check(header.sourceParent==='header-secondary-actions','Sources is not beside Refresh');
                check(header.marketStatusRemoved,'obsolete status still visible');
                check(Math.abs(header.sources.y-header.refresh.y)<8,'Sources/Refresh not same row');
                check(header.sources.x<header.refresh.x&&header.refresh.x-header.sources.right<16,'Sources and Refresh not adjacent');
                check(header.sources.x>=header.header.x-1&&header.picker.right<=header.header.right+1,'header controls beyond header bounds');
                check(header.title.right<=header.header.right+1,'brand title overflows');
                check(header.header.height<=(width<=620?220:135),'header not compact: '+header.header.height+' px');
                if(width<=1100){
                  check(Math.abs(header.stamp.y-header.theme.y)<22,'Macro and theme separated');
                  check(header.actions.y>header.timeframes.y,'mobile actions not under period');
                }
                await page.locator('#theme-toggle').click();
                await page.waitForTimeout(500);
                const day=await colors(page);
                check(day.theme==='day'&&day.button.includes('Día')&&day.pressed==='true','day switch failed');
                check(day.bodyBg==='rgb(243, 241, 235)','day body not styled: '+day.bodyBg);
                check(day.heading==='rgb(32, 51, 65)','day heading contrast: '+day.heading);
                check(day.width<=width+1,'horizontal overflow daylight '+name+' '+day.width+'/'+width);
                check(day.period==='1M','timeframe changed by theme');
                const dayHeader=await headerLayout(page);
                check(dayHeader.titleColors[0]!==dayHeader.titleColors[1],'day theme brand not bicolor');
                check(dayHeader.scrollWidth<=width+1,'day header causes horizontal overflow');
                result.screens[name].dayHeader=dayHeader;
                await page.screenshot({path:'evidence-theme/'+name+'-day.png',fullPage:true});
                await page.locator('#header-period-picker summary').click();
                const calendar=await page.locator('#header-dates input[type=date]').first().evaluate(el=>({
                  scheme:getComputedStyle(el).colorScheme,color:getComputedStyle(el).color,
                  background:getComputedStyle(el).backgroundColor
                }));
                check(calendar.scheme==='light'&&calendar.background==='rgb(255, 254, 250)','calendar failed day style');
                await page.keyboard.press('Escape');
                await page.reload({waitUntil:'domcontentloaded',timeout:45000});
                const persisted=await colors(page);
                check(persisted.theme==='day'&&persisted.button.includes('Día'),'theme not persisted');
                check(persisted.bodyBg==='rgb(243, 241, 235)','flash/prepaint CSS day not restored');
                if(name==='desktop'){
                  await page.waitForSelector('#curve-graph svg[data-macro-svg]',{timeout:55000});
                  const graph=await colors(page);
                  check(graph.axColor==='rgb(77, 104, 118)','macro axis contrast not adapted: '+graph.axColor);
                  if(graph.goldLine)check(graph.goldLine==='rgb(161, 107, 18)','gold chart not adapted: '+graph.goldLine);
                  await page.locator('[data-inspect="v4-flows"]').click();
                  await page.waitForTimeout(600);
                  const expanded=await page.locator('.detail-box').evaluate(el=>({
                    background:getComputedStyle(el).backgroundImage,foreground:getComputedStyle(el).color,
                    width:document.documentElement.scrollWidth
                  }));
                  check(expanded.foreground==='rgb(33, 55, 68)','expanded chart dark text not adapted');
                  await page.screenshot({path:'evidence-theme/desktop-expanded-day.png',fullPage:false});
                  await page.locator('#detail-close').click();
                }
                await page.locator('#theme-toggle').click();
                const night=await colors(page);
                check(night.theme==='night'&&night.button.includes('Noche')&&night.pressed==='false','night restore failed');
                check(night.bodyBg==='rgb(7, 12, 18)','original night palette altered');
                check(night.width<=width+1,'horizontal overflow night '+name);
                await page.screenshot({path:'evidence-theme/'+name+'-night.png',fullPage:false});
                result.screens[name]={...result.screens[name],nightFirst:first,day,persisted,night,calendar};
              }catch(err){result.errors.push({name,type:'assertion',message:String(err)})}
              await context.close();
            }
          }finally{
            await browser.close();
            fs.writeFileSync('evidence-theme/result.json',JSON.stringify(result,null,2));
            console.log('THEME_TEST_RESULT '+JSON.stringify(result));
            if(result.errors.length)process.exitCode=1;
          }
          EOF
          node verify-theme.mjs
      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-day-night-screenshots
          path: evidence-theme/
          retention-days: 7
          if-no-files-found: warn
