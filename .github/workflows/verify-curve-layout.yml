name: 'Verificar legibilidad de curva Treasury'
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-curve-layout.yml'
  workflow_run:
    workflows: ['Publicar Metals Terminal']
    types: [completed]
permissions:
  contents: read
jobs:
  smoke:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 11
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Chromium
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Comprobar visualización y contenido de la curva
        run: |
          mkdir -p evidence-curve
          cat > test-curve.mjs <<'EOF'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const result={createdAt:new Date().toISOString(),cases:{},errors:[]};
          const check=(test,message)=>{if(!test)throw Error(message)};
          const base='https://cgam-coder.github.io/metals-terminal/?period=1mo&curveLayout=20261121';
          const read=async page=>page.evaluate(()=>{
            const el=selector=>document.querySelector(selector);
            const bounds=selector=>{const node=el(selector);if(!node)return null;const r=node.getBoundingClientRect();return {top:r.top,bottom:r.bottom,left:r.left,right:r.right,width:r.width,height:r.height,clientHeight:node.clientHeight,scrollHeight:node.scrollHeight,clientWidth:node.clientWidth,scrollWidth:node.scrollWidth}};
            const ds=selector=>[...document.querySelectorAll(selector)].map(node=>{
              const r=node.getBoundingClientRect();return {text:node.textContent.trim(),width:r.width,scrollWidth:node.scrollWidth,clientWidth:node.clientWidth,right:r.right,left:r.left,top:r.top,bottom:r.bottom};
            });
            return {
              panel:bounds('#macroeconomia'),heading:bounds('.curve-panel .panel-head'),
              title:bounds('.curve-panel .panel-head .panel-title'),
              controls:bounds('.curve-panel .macro-controls'),caption:bounds('#curve-caption'),
              period:bounds('#curve-range-summary'),periodMain:bounds('.curve-period-main'),
              periodMoves:bounds('.curve-period-moves'),changes:ds('.curve-period-move strong'),
              chart:bounds('#curve-graph'),legend:bounds('.curve-panel .legend'),
              bottom:bounds('.curve-bottom'),note:bounds('#yield-stamp'),
              metrics:ds('.curve-panel .yield-metric'),values:ds('.curve-panel .yield-metric strong'),
              currentWindow:el('#curve-range-summary')?.dataset.macroPeriod,
              periodText:el('#curve-range-summary')?.innerText,
              theme:document.documentElement.dataset.theme||'night',
              viewport:innerWidth,scrollWidth:document.documentElement.scrollWidth
            };
          });
          try{
            for(const [label,width,height,day] of [['desktop-1920',1920,1000,false],['desktop-1440',1440,900,false],['desktop-1280',1280,900,true],['desktop-1024',1024,850,false],['desktop-900',900,860,true],['mobile-390',390,844,true],['mobile-360',360,780,false]]){
              const context=await browser.newContext({viewport:{width,height},deviceScaleFactor:1});
              const page=await context.newPage();
              page.on('pageerror',err=>result.errors.push({label,type:'pageerror',message:err.stack||err.message}));
              try{
                await page.goto(base,{waitUntil:'domcontentloaded',timeout:50000});
                await page.waitForFunction(()=>document.querySelector('#yield-stats .yield-metric strong')?.textContent?.includes('%')===true,null,{timeout:45000});
                if(day)await page.locator('#theme-toggle').click();
                const measure=async(key)=>{
                  await page.waitForTimeout(250);
                  const value=await read(page);
                  check(value.metrics.length===4&&value.values.length===4,'four real Treasury values must be visible '+key);
                  check(value.changes.length===3,'three changes missing '+key);
                  check(value.title.bottom<=value.controls.top+2,'header title collides with controls '+key+' '+JSON.stringify(value));
                  check(value.controls.bottom<=value.caption.top+2,'controls collide with caption '+key);
                  check(value.caption.bottom<=value.period.top+2,'caption collides with summary '+key);
                  check(value.period.bottom<=value.chart.top+2,'summary overlaps chart '+key);
                  check(value.chart.height>=90,'chart too short '+key+' '+value.chart.height);
                  check(value.legend.bottom<=value.bottom.top+3,'legend overlaps yield text '+key);
                  check(value.note.bottom<=value.panel.bottom+2,'Treasury footer clipped by panel '+key+' '+(value.note.bottom-value.panel.bottom));
                  check(value.panel.scrollHeight<=value.panel.clientHeight+3,'panel content clipped '+key+' '+value.panel.scrollHeight+'/'+value.panel.clientHeight);
                  check(value.values.every(x=>x.right<=value.panel.right-6&&x.left>=value.panel.left+5&&x.width>=30),'numeric values clipped outside card '+key);
                  check(value.changes.every(x=>x.scrollWidth<=x.clientWidth+2),'delta overflow in summary '+key);
                  check(value.scrollWidth<=width+1,'page horizontal overflow '+key+' '+value.scrollWidth+'/'+width);
                  check(value.metrics.every(x=>x.right<=value.panel.right-5),'yield metrics overflow '+key);
                  check(value.values.every(x=>x.text.includes('%')||x.text.includes('pp')),'Treasury values unexpectedly missing units '+key);
                  return value;
                };
                const monthly=await measure(label+'-1M');
                check(monthly.currentWindow==='1M','1M not selected');
                await page.screenshot({path:'evidence-curve/'+label+'-1m.png',fullPage:false});
                if(width===1440||width===390){
                  await page.locator('[data-global-period="10y"]').click();
                  await page.waitForFunction(()=>document.querySelector('#curve-range-summary')?.dataset.macroPeriod==='10A',null,{timeout:10000});
                  const yearly=await measure(label+'-10A');
                  await page.screenshot({path:'evidence-curve/'+label+'-10a.png',fullPage:false});
                  result.cases[label]={monthly:monthly,tenYears:yearly};
                }else result.cases[label]={monthly};
              }catch(e){result.errors.push({label,type:'assertion',message:String(e)})}
              await context.close();
            }
          }finally{
            await browser.close();
            fs.writeFileSync('evidence-curve/results.json',JSON.stringify(result,null,2));
            console.log('CURVE_LAYOUT_RESULT '+JSON.stringify(result));
            if(result.errors.length)process.exitCode=1;
          }
          EOF
          node test-curve.mjs
      - name: Guardar evidencia
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: treasury-curve-layout
          path: evidence-curve/
          retention-days: 7
          if-no-files-found: warn
