name: V4.9 · Validar fuentes candidatas
on:
  push:
    branches: ['audit/v49-provider-probe']
    paths: ['.github/workflows/probe-v49.yml']
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Consulta secuencial de los cuatro futuros
        run: |
          node --input-type=module - <<'EOF'
          const result=[];
          const delay=ms=>new Promise(r=>setTimeout(r,ms));
          for(const symbol of ['GC=F','SI=F','HG=F','BZ=F']){
            const url='https://proxy.cors.dev/https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(symbol)+'?range=10y&interval=1d';
            try{
              let r=await fetch(url,{signal:AbortSignal.timeout(25000),headers:{Origin:'https://cgam-coder.github.io'}});
              if(r.status===429){const raw=r.headers.get('retry-after');const retry=raw?(Number.isFinite(Number(raw))?Number(raw)*1000:Date.parse(raw)-Date.now()):3000;if(retry>=0&&retry<=10000){await delay(Math.max(3000,retry));r=await fetch(url,{signal:AbortSignal.timeout(25000),headers:{Origin:'https://cgam-coder.github.io'}})}}
              if(!r.ok){result.push({symbol,http:r.status,retry:r.headers.get('retry-after')});continue;}
              const x=(await r.json()).chart?.result?.[0],q=x?.indicators?.quote?.[0],m=x?.meta;
              result.push({symbol,http:r.status,identity:{symbol:m?.symbol,type:m?.instrumentType,currency:m?.currency,exchange:m?.exchangeName,timezone:m?.exchangeTimezoneName,name:m?.shortName},n:x?.timestamp?.length,first:new Date(x.timestamp[0]*1000).toISOString(),last:new Date(x.timestamp.at(-1)*1000).toISOString(),recent:x.timestamp.slice(-4).map((t,i)=>({date:new Date(t*1000).toISOString(),close:q.close.slice(-4)[i]}))});
            }catch(e){result.push({symbol,error:String(e)})}
            await delay(650);
          }
          console.log('FUTURES_SEQUENTIAL '+JSON.stringify(result));
          EOF
