name: Verificar widgets intradia (una ejecucion por cambio del test)
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/verify-intraday.yml'
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Preparar Chromium de pruebas
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Comprobar cinco instrumentos en navegador real
        env:
          PREVIEW_URL: https://cgam-coder.github.io/metals-terminal/preview/intradia/
        run: |
          cat > verify-intraday.mjs <<'EOF'
          import {chromium} from 'playwright';
          import fs from 'node:fs';
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          fs.mkdirSync('test-output',{recursive:true});
          const result={url:process.env.PREVIEW_URL,timestamp:new Date().toISOString(),desktop:{},mobile:{},errors:[]};
          for(const [name,width,height] of [['desktop',1440,900],['mobile',390,844]]){
            const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            page.on('pageerror',error=>result.errors.push({device:name,type:'page',message:error.message}));
            page.on('response',r=>{if(r.url().includes('tradingview')&&r.status()>=400)result.errors.push({device:name,type:'http',status:r.status(),url:r.url().slice(0,110)})});
            try{
              await page.goto(process.env.PREVIEW_URL,{waitUntil:'domcontentloaded',timeout:40000});
              await page.waitForTimeout(15000);
              const defined=await page.evaluate(()=>({mini:!!customElements.get('tv-mini-chart'),advanced:!!customElements.get('tv-advanced-chart')}));
              result[name].defined=defined;
              result[name].minis=await page.locator('tv-mini-chart').count();
              result[name].frames=page.frames().map(f=>f.url()).filter(u=>u.includes('tradingview')).slice(0,20);
              await page.screenshot({path:'test-output/'+name+'-minis.png',fullPage:true});
              const symbols=['COMEX:GC1!','COMEX:SI1!','COMEX:HG1!','NYMEX:BZ1!','CBOE:VIX'];
              for(let i=0;i<symbols.length;i++){
                await page.locator('.open').nth(i).click();
                await page.waitForTimeout(name==='desktop'?4500:2000);
                const widget=page.locator('tv-advanced-chart');
                const initial=await widget.count();
                const attributes=initial?await widget.evaluate(el=>({symbol:el.getAttribute('symbol'),interval:el.getAttribute('interval'),range:el.getAttribute('date-range'),size:el.getBoundingClientRect().height})):{};
                const frames=page.frames().map(f=>f.url()).filter(u=>u.includes('tradingview')).slice(-8);
                result[name][symbols[i]]={initial,attributes,frames};
                if(name==='desktop')await page.locator('.modal-inner').screenshot({path:'test-output/'+name+'-'+i+'-detail.png'});
                if(i===0){
                  for(const value of ['60','120','360']){
                    await page.locator('[data-res="'+value+'"]').click();
                    await page.waitForTimeout(800);
                    result[name][symbols[i]]['resolution'+value]=await page.locator('tv-advanced-chart').getAttribute('interval');
                  }
                  await page.locator('[data-mperiod="1S"]').click();
                  await page.waitForTimeout(800);
                  result[name][symbols[i]].weekRange=await page.locator('tv-advanced-chart').getAttribute('date-range');
                }
                await page.locator('#close').click();
              }
            }catch(e){result.errors.push({device:name,type:'exception',message:String(e)})}
            await page.close();
          }
          await browser.close();
          fs.writeFileSync('test-output/result.json',JSON.stringify(result,null,2));
          console.log('INTRADAY_AUDIT_BEGIN');
          console.log(JSON.stringify(result,null,2));
          console.log('INTRADAY_AUDIT_END');
          EOF
          node verify-intraday.mjs
      - name: Guardar capturas y auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metals-intraday-widget-evidence
          path: test-output/
          if-no-files-found: warn
