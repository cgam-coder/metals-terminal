name: Publicar Metals Terminal
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'theme.css'
      - 'quality.js'
      - 'explanations.js'
      - 'indices.js'
      - 'fundamentals.js'
      - 'data/**'
      - 'preview/intradia/**'
      - 'preview/v4/**'
      - 'preview/etf-compare/**'
      - '.github/workflows/pages.yml'
  workflow_run:
    workflows: ['Actualizar datos macro oficiales']
    types: [completed]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: metals-pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Obtener versión más reciente de main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Preparar sitio estático
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp theme.css _site/theme.css
          cp quality.js _site/quality.js
          cp explanations.js _site/explanations.js
          cp indices.js _site/indices.js
          cp fundamentals.js _site/fundamentals.js
          cp data/series.json _site/data/series.json
          cp data/vix-history.json _site/data/vix-history.json
          cp data/v4-cot-snapshot.json _site/data/v4-cot-snapshot.json
          cp data/v4-gvz-snapshot.json _site/data/v4-gvz-snapshot.json
          cp data/v4-flows-facts.json _site/data/v4-flows-facts.json
          cp data/v4-etf-sec-quarterly.json _site/data/v4-etf-sec-quarterly.json
          mkdir -p _site/preview/intradia
          cp preview/intradia/index.html _site/preview/intradia/index.html
          mkdir -p _site/preview/v4
          cp preview/v4/index.html _site/preview/v4/index.html
          mkdir -p _site/preview/etf-compare
          cp preview/etf-compare/index.html _site/preview/etf-compare/index.html
          touch _site/.nojekyll
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      # GitHub's artifact API can temporarily return zero results immediately
      # after a successful upload; delay metadata lookup without duplicating jobs.
      - name: Esperar a la indexación del artefacto de Pages
        run: sleep 10
      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Certificar archivos realmente publicados
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          base="${SITE_URL%/}"
          test "$base" = "https://cgam-coder.github.io/metals-terminal"
          for attempt in 1 2 3 4 5 6; do
            ok=1
            for file in index.html fundamentals.js quality.js explanations.js; do
              if ! curl -fsSL --max-time 15 --retry 1 -H 'Cache-Control: no-cache' "$base/$file?verify=$GITHUB_SHA-$attempt" -o "/tmp/pages-$file" || ! cmp -s "_site/$file" "/tmp/pages-$file"; then
                echo "Pendiente de propagación: $file (intento $attempt)"
                ok=0
              fi
            done
            if [ "$ok" = 1 ]; then
              echo "PASS: HTML y tres controladores V5 publicados, idénticos al artefacto"
              grep -o 'METALS · V[0-9.]*' /tmp/pages-index.html | tail -1
              exit 0
            fi
            sleep 8
          done
          echo "::error::No se ha acreditado la publicación efectiva de todos los archivos"
          exit 1
