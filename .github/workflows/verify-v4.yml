name: Verificar Metals Terminal V4.2 sin FedWatch
on:
  workflow_dispatch:
  push:
    paths: ['.github/workflows/verify-v4.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Instalar navegador
        run: |
          npm install --no-save playwright@1.58.2
          npx playwright install chromium
      - name: Inspeccionar render real y responsividad
        run: |
          cat > verify-v4.mjs <<'EOF'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          fs.mkdirSync('v4-evidence',{recursive:true});
          const browser=await chromium.launch({headless:true,args:['--no-sandbox']});
          const report={timestamp:new Date().toISOString(),cases:{},errors:[]};
          for(const [label,width,height] of [['desktop',1440,920],['tablet',1080,860],['mobile',390,844],['small',360,760]]){
            const page=await browser.newPage({viewport:{width,height},deviceScaleFactor:1});
            page.on('pageerror',e=>report.errors.push({device:label,type:'runtime',message:e.message}));
            try{
              await page.goto('https://cgam-coder.github.io/metals-terminal/?period=1mo',{waitUntil:'domcontentloaded',timeout:40000});
              await page.waitForTimeout(label==='desktop'?25000:7000);
              const data=await page.evaluate(()=>{
                const boxes={},ids=['.dashboard','.dashboard>.policy-panel','#policy-graph','#posicionamiento-expectativas','#v4-cot','#v4-oi','#v4-volatility','#v4-flows'];
                for(const id of ids){const el=document.querySelector(id),r=el?.getBoundingClientRect();boxes[id]=r?{x:Math.round(r.left),y:Math.round(r.top),w:Math.round(r.width),h:Math.round(r.height)}:null}
                return {boxes,documentWidth:document.documentElement.scrollWidth,viewportWidth:innerWidth,bodyWidth:document.body.scrollWidth,cotText:document.getElementById('v4-cot-state')?.innerText,oiText:document.getElementById('v4-oi-state')?.innerText,gvzText:document.getElementById('v4-volatility-state')?.innerText,flowsText:document.getElementById('v4-flows-state')?.innerText,gvzChart:!!document.querySelector('#v4-volatility-chart svg'),cotChart:!!document.querySelector('#v4-cot-chart svg'),oiChart:!!document.querySelector('#v4-oi-chart svg'),fedWatchPresent:!!document.querySelector('#v4-fedwatch')};
              });
              report.cases[label]=data;
              if(data.documentWidth>data.viewportWidth)throw Error('Desbordamiento horizontal '+label);
              if(data.fedWatchPresent||!data.boxes['.dashboard>.policy-panel']||!data.boxes['#policy-graph'])throw Error('FedWatch persiste o Tipos oficiales no ocupa la columna '+label);
              if(data.boxes['.dashboard>.policy-panel'].h<260)throw Error('Tarjeta de tipos oficiales demasiado baja '+label);
              if(label==='desktop'&&(!data.cotChart||!data.oiChart||!data.gvzChart||!data.flowsText?.includes('SLV')))throw Error('Datos oficiales sin representar: COT/OI/GVZ/ETF');
              const comparison=await page.evaluate(()=>{
                const cot=marketChartCache.get("v4-cot-chart"),oi=marketChartCache.get("v4-oi-chart");
                return {cotLines:cot?.lines?.map(x=>x.label),oiLines:oi?.lines?.map(x=>x.label),cotDates:cot?.dates?.length,oiDates:oi?.dates?.length,
                  cotNames:document.querySelector('#v4-cot-state')?.innerText,oiNames:document.querySelector('#v4-oi-state')?.innerText};
              });
              report.cases[label].comparison=comparison;
              if(!comparison.cotLines||!comparison.oiLines||
                comparison.cotLines.length!==2||comparison.oiLines.length!==2||
                !comparison.cotNames.includes('Oro GC')||!comparison.cotNames.includes('Plata SI')||
                !comparison.oiNames.includes('Oro GC')||!comparison.oiNames.includes('Plata SI'))throw Error('Las comparativas oro/plata no tienen dos series verificadas');
              await page.screenshot({path:'v4-evidence/'+label+'.png',fullPage:true});
              if(label==='desktop'){
                await page.locator('[data-inspect="v4-cot"]').click();
                report.cases.desktop.modalCot=await page.locator('#detail-title').innerText();
                report.cases.desktop.modalChart=await page.locator('#detail-chart svg').count();
                report.cases.desktop.modalComparison=await page.evaluate(()=>marketChartCache.get("v4-detail-graph")?.lines?.map(x=>x.label));
                if(report.cases.desktop.modalComparison?.length!==2)throw Error('Ampliado COT no muestra oro y plata');
                await page.locator('#detail-close').click();
                await page.locator('[data-inspect="v4-oi"]').click();
                report.cases.desktop.modalOI=await page.evaluate(()=>marketChartCache.get("v4-detail-graph")?.lines?.map(x=>x.label));
                if(report.cases.desktop.modalOI?.length!==2)throw Error('Ampliado OI no muestra oro y plata');
                await page.locator('#detail-close').click();
                await page.locator('#global-timeframes [data-global-period="5y"]').click();
                await page.waitForTimeout(1500);
                report.cases.desktop.fiveYearTitle=await page.locator('#v4-cot-dates').innerText();
                await page.locator('#global-timeframes [data-global-period="1mo"]').click();
              }
            }catch(e){report.errors.push({device:label,type:'exception',message:String(e)})}
            await page.close();
          }
          // Production smoke only: the release must not depend on the preview URL.
          const prod=await browser.newPage({viewport:{width:1440,height:900}});
          try{
            await prod.goto('https://cgam-coder.github.io/metals-terminal/?period=1mo',{waitUntil:'domcontentloaded',timeout:40000});
            await prod.waitForTimeout(10000);
            report.production=await prod.evaluate(()=>({
              version:document.getElementById('version')?.textContent,
              cards:['v4-cot','v4-oi','v4-volatility','v4-flows'].map(id=>!!document.getElementById(id)),fedWatchPresent:!!document.getElementById('v4-fedwatch'),ratesHeight:document.querySelector('.dashboard>.policy-panel')?.getBoundingClientRect().height,
              cotChart:!!document.querySelector('#v4-cot-chart svg'),
              oiChart:!!document.querySelector('#v4-oi-chart svg'),
              cotLines:marketChartCache.get('v4-cot-chart')?.lines?.map(x=>x.label),
              oiLines:marketChartCache.get('v4-oi-chart')?.lines?.map(x=>x.label),
              gvzChart:!!document.querySelector('#v4-volatility-chart svg'),
              flows:document.getElementById('v4-flows-state')?.innerText
            }));
            if(!report.production.cards.every(Boolean)||report.production.fedWatchPresent||report.production.ratesHeight<260||!report.production.cotChart||!report.production.oiChart||!report.production.gvzChart||
               report.production.cotLines?.length!==2||report.production.oiLines?.length!==2)throw Error('V4.2 failed: FedWatch present, rates undersized, or comparisons incomplete');
            await prod.screenshot({path:'v4-evidence/production.png',fullPage:true});
          }catch(e){report.errors.push({device:'production',type:'exception',message:String(e)})}
          await prod.close();
          await browser.close();
          console.log('V4_EVIDENCE_START');
          console.log(JSON.stringify(report,null,2));
          console.log('V4_EVIDENCE_END');
          fs.writeFileSync('v4-evidence/result.json',JSON.stringify(report,null,2));
          EOF
          node verify-v4.mjs
      - name: Guardar pruebas visuales
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metals-v4-visual-and-data-proof
          path: v4-evidence/
          if-no-files-found: warn
