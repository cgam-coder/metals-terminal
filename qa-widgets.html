<!doctype html><html lang="es"><meta charset="utf-8"><title>Metals Terminal · Comprobación temporal de widgets</title>
<style>body{background:#07111a;color:#ddd;font:14px Arial;padding:20px}section{display:grid;grid-template-columns:repeat(4,minmax(200px,1fr));gap:14px}article{border:1px solid #395163;border-radius:10px;padding:12px;min-height:170px}h3{margin:0 0 12px}.slot{height:120px}.slot .tradingview-widget-container,.slot .tradingview-widget-container__widget{width:100%;height:100%}@media(max-width:1000px){section{grid-template-columns:repeat(2,1fr)}}</style>
<h1>QA temporal: fuentes sin modificaciones ni sustituciones</h1><section id="cards"></section>
<script>
const symbols=['COMEX:GC1!','COMEX:SI1!','COMEX:HG1!','TVC:DXY','TVC:VIX','TVC:GOLDSILVER','FX:EURUSD','OANDA:XAUUSD','OANDA:XAGUSD','OANDA:XCUUSD','TVC:UKOIL','FOREXCOM:UKOIL'];
const root=document.getElementById('cards');
symbols.forEach(symbol=>{
const card=document.createElement('article');card.innerHTML='<h3>'+symbol+'</h3><div class="slot"><div class="tradingview-widget-container"><div class="tradingview-widget-container__widget"></div></div></div>';root.appendChild(card);
const script=document.createElement('script');script.type='text/javascript';script.async=true;script.src='https://s3.tradingview.com/external-embedding/embed-widget-single-quote.js';script.textContent=JSON.stringify({symbol,width:'100%',isTransparent:true,colorTheme:'dark',locale:'es'});card.querySelector('.tradingview-widget-container').appendChild(script);
});
</script></html>
