<!doctype html><meta charset="utf-8"><title>QA futures parser</title><body style="white-space:pre-wrap;background:#09141e;color:#dce8f3;font:12px monospace"><div id="r">Extrayendo futuros GC/SI...</div><script>
(async()=>{const urls=[["GC","https://trading-commodity.com/download/gc/"],["SI","https://trading-commodity.com/download/si/"]];const results=await Promise.all(urls.map(async ([name,url])=>{try{const response=await fetch(url,{mode:"cors",credentials:"omit",signal:AbortSignal.timeout(12000)});const html=await response.text();const doc=new DOMParser().parseFromString(html,"text/html");const tables=[...doc.querySelectorAll("table")].map((table,i)=>({i,headers:[...table.querySelectorAll("thead th")].map(x=>x.textContent.trim()),rows:[...table.querySelectorAll("tbody tr")].slice(0,16).map(tr=>[...tr.querySelectorAll("td")].map(el=>el.textContent.trim()))}));return{name,http:response.status,tables:tables.slice(0,4),h2:[...doc.querySelectorAll("h2")].map(h=>h.textContent.trim()).slice(0,10)}}catch(e){return{name,error:String(e)}}}));document.querySelector("#r").textContent=JSON.stringify(results,null,2)})();</script></body>
